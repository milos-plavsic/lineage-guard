name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.25"
          enable-cache: true
      - run: uv sync --locked --extra dev --extra mcp
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest --cov --cov-report=term-missing
      - run: uv build
      - name: Smoke-test built wheel
        shell: bash
        run: |
          wheel=$(find dist -name '*.whl' -print -quit)
          uv run --isolated --no-project --with "$wheel" lineage-guard --output smoke-report.json
          test -s smoke-report.json

  accessibility:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.25"
          enable-cache: true
      - run: uv sync --locked
      - run: uv run python scripts/export_static_demo.py site
      - name: WCAG 2 AA browser audit
        shell: bash
        run: |
          python -m http.server 8000 --bind 127.0.0.1 --directory site &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          npx --yes pa11y-ci@4.1.1 --config .pa11yci.json http://127.0.0.1:8000/
